# ── Thêm vào server block HTTPS trong /etc/nginx/sites-available/tienmai ──────
# Đặt TRƯỚC location / (root).

    location = /projects/crypto-analysis { return 301 /projects/crypto-analysis/; }
    location /projects/crypto-analysis/ {
        alias /root/projects/crypto-analysis/frontend/dist/;
        try_files $uri $uri/ /projects/crypto-analysis/index.html;
    }
    # Old name (crypto-news, before v2.1.0): keep shared links working.
    location ~ ^/projects/crypto-news(/.*)?$ { return 301 /projects/crypto-analysis$1; }

    location /api/crypto-analysis/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
